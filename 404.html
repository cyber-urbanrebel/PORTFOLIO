<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edwin Mburu Kamau — Portfolio</title>
  <!--
    GitHub Pages SPA redirect.
    Encodes the path/query/hash into the URL then redirects to the root,
    where the main index.html decodes it and restores the intended location.
    Technique: https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    var segmentCount = 1; // 1 for project pages (e.g. /PORTFOLIO/), 0 for user/org pages
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
